name: Backend checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: skviderm_catalog_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d skviderm_catalog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l *.go)"
      - name: Test against PostgreSQL
        env:
          SKVIDERM_TEST_DATABASE_URL: postgres://postgres:test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/skviderm_catalog_test?sslmode=disable
        run: go test -count=1 -v ./...
      - name: Test legacy cart importer
        run: python3 -B -m unittest discover -s scripts -p test_legacy_carts.py
      - name: Build Linux image
        run: docker build --platform linux/amd64 -t cosmetician-backend-go:ci .
